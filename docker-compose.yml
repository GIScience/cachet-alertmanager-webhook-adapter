services:
  adapter:
    build:
      context: .
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  load-components:
    build:
      context: .
    command: load-components --prune
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
    profiles:
      - migration

  load-dependency-graph:
    build:
      context: .
    command: load-dependencies http://adapter:8002 --prune
    volumes:
      - ./data:/app/data
    depends_on:
      adapter:
        condition: service_healthy
    profiles:
      - migration